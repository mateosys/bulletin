<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A quiet social bulletin board for sharing updates with friends."
    />

    <title>Bulletin</title>
    <link rel="stylesheet" href="" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body class="bg-stone-100 min-h-screen text-stone-950 antialiased">
    <header class="bg-white border-stone-300 border-b">
      <div
        class="flex justify-between items-center mx-auto px-5 py-4 max-w-2xl"
      >
      
        <a href="/" class="font-bold text-xl tracking-tight"><img class="w-auto h-4" src="public/SVG/logo.svg" alt=""></a>

        <button
          type="button"
          class="hover:bg-stone-100 px-4 py-2 border border-stone-300 rounded-full font-medium text-sm"
        >
          Profile
        </button>
      </div>
    </header>
    <main class="mx-auto px-5 py-10 max-w-2xl">
      <section aria-labelledby="page-heading">
        <p class="font-medium text-stone-500 text-sm">Your board</p>

        <h1 id="page-heading" class="mt-1 font-bold text-3xl tracking-tight">
          What’s going on?
        </h1>

        <form id="bulletin-form" class="bg-white mt-8 p-5 border border-stone-300 rounded-2xl">
          <label for="bulletin-content" class="font-semibold">
            Post a bulletin
          </label>

          <textarea
            id="bulletin-content"
            name="content"
            rows="4"
            maxlength="500"
            required
            placeholder="Share something with your friends…"
            class="block bg-stone-50 mt-3 p-4 border border-stone-300 focus:border-stone-950 rounded-xl focus:outline-none w-full placeholder:text-stone-400 resize-y"
          ></textarea>

          <div class="flex justify-between items-center mt-4">
            <p id="character-count" class="text-stone-500 text-sm">
              500 characters remaining
            </p>

            <button
              type="submit"
              class="bg-stone-950 hover:bg-stone-700 px-5 py-2.5 rounded-full font-semibold text-white text-sm"
            >
              Publish
            </button>
          </div>
        </form>
      </section>

      <section class="mt-12" aria-labelledby="recent-heading">
        <h2 id="recent-heading" class="font-bold text-xl">Recent bulletins</h2>

        <div
        id="bulletin-feed"
        aria-live="polite"
        class="space-y-4 mt-5">
          <article class="bg-white p-5 border border-stone-300 rounded-2xl">
            <header class="flex justify-between items-start gap-4">
              <div>
                <h3 class="font-semibold">Mateo</h3>
                <p class="text-stone-500 text-sm">
                  <time datetime="2026-09-30T11:30:00-05:00">
                    September 30 at 11:30 AM
                  </time>
                </p>
              </div>

              <button
                type="button"
                class="font-medium text-stone-500 hover:text-stone-950 text-sm"
              >
                Edit
              </button>
            </header>

            <p class="mt-4 leading-7">
              Building a quieter place to share updates with friends.
            </p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
